name: Build App
description: none
inputs:
  platform:
    description: The platform to build for
    required: true
runs:
  using: composite
  steps:
    - name: Setup Nix
      uses: ./.github/actions/nix-setup

    - shell: bash
      run: |
        run build $platform
        stat build/tfdocs
      env:
        platform: ${{ inputs.platform }}

    - uses: actions/upload-artifact@v4
      with:
        path: build/tfdocs
        name: alpine-build
