name: Build App
description: none
inputs:
  platform:
    description: The platform to build for
    required: true
runs:
  using: composite
  steps:
    - name: Setup Nix
      uses: ./.github/actions/nix-setup

    - shell: bash
      run: |
        mkdir -p build
        docker buildx build . \
          -f build-containers/$platform-build.dockerfile \
          -t tmp/$platform-build

        docker run \
          --rm \
          -v build:/result \
          tmp/$platform-build \
          sh -c "set -e; cp dist/tfdocs /result/tfdocs-$platform"
      env:
        platform: ${{ inputs.platform }}

    - uses: actions/upload-artifact@v4
      with:
        path: build/tfdocs-${{inputs.platform}}
        name: ${{ inputs.platform }}-build
