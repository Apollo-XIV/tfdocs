name: Scan IaC with Checkov
description: Use the Checkov CLI tool to scan the infrastructure for misconfigurations
inputs:
  plan:
    required: false
    default: "none"
    description: If provided, scan a plan file instead of the infra directory

runs:
  using: composite
  steps:
    # Need to have checked out the repo and setup nix
    - if: inputs.plan == 'none'
      working-directory: infra
      shell: bash
      run: |
        # scan the infrastructure directory for misconfigurations
        checkov --directory .

    - if: inputs.plan != 'none'
      working-directory: infra
      shell: bash
      run: |
        terraform show -json plan | refmt
        checkov -f fmt.json
