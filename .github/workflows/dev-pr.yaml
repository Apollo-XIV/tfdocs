name: Dev PR Checks

concurrency:
  group: dev-pr-${{github.event.pull_request.number}}
  cancel-in-progress: true

# Triggers
on:
  pull_request:
    branches:
      - dev
  merge_group:

# All jobs must pass before merge
jobs:

  sync-environment:
    name: Sync Terraform Environment
    permissions: write-all
    uses: ./.github/workflows/sync-env.yaml
    secrets: inherit

  code-ci:
    name: Code CI Workflows
    permissions: write-all
    needs:
      - sync-environment
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Test Python code
        run: run py-test-cov-full

      - name: Lint code
        run: run lint-fix

      - name: Scan Infrastructure
        uses: ./.github/actions/checkov-scan

      - name: Commit changes
        uses: ./.github/actions/commit
        with:
          message: "ci: linting"
          token: ${{ secrets.GITHUB_TOKEN }}

  create-plan:
    if: always()
    name: Terraform Plan
    needs: code-ci
    permissions: write-all
    secrets: inherit
    uses: ./.github/workflows/tf-plan.yaml

  tag:
    if: contains(join(github.event.pull_request.labels.*.name, ''), 'test-release')
    needs: code-ci
    name: Create Tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{github.event.pull_request.head.ref}}
          ssh-key: ${{secrets.BRANCH_BYPASS_KEY}}
      - uses: ./.github/actions/tag-commit
        with:
          token: ${{secrets.BRANCH_BYPASS_KEY}}
        
