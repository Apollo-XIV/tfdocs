name: Dev Branch Merge

concurrency:
  group: dev-merge
  cancel-in-progress: true

# Triggers
on:
  push:
    branches:
      - dev

jobs:
 
  create-plan:
    name: Terraform Plan
    needs: tag
    permissions: write-all
    secrets: inherit
    uses: ./.github/workflows/tf-plan.yaml

  check-plan-for-changes:
    name: Check plan for changes
    runs-on: ubuntu-24.04
    needs: create-plan
    outputs:
      diff: ${{ steps.check.outputs.diff }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: infra

      - id: check
        working-directory: infra
        run: |
          line_count=$(terraform show plan | wc -l)
          if [ "$line_count" -gt 5 ]; then
            echo "Changes detected"
            echo "diff=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected"
            echo "diff=false" >> $GITHUB_OUTPUT
          fi

  apply-plan:
    if: ${{needs.check-plan-for-changes.diff == 'true' }}
    permissions: write-all
    name: Apply Terraform Plan
    needs: check-plan-for-changes
    runs-on: ubuntu-24.04
    environment: aws
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          ssh-key: ${{secrets.BRANCH_BYPASS_KEY}}

      - uses: ./.github/actions/nix-setup

      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: infra

      - name: Terraform Apply
        run: |
          unset AWS_PROFILE
          terraform init
          terraform apply plan
        env:
          TF_VAR_ENV: dev
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: remove plan file
        run: |
          rm plan

      - name: Commit changes
        uses: ./.github/actions/commit
        with:
          message: "ci: terraform apply"
          token: ${{ secrets.GITHUB_TOKEN }}

  tag:
    name: Create Tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{github.event.pull_request.head.ref}}
          ssh-key: ${{secrets.BRANCH_BYPASS_KEY}}
      - uses: ./.github/actions/tag-commit
        with:
          token: ${{secrets.BRANCH_BYPASS_KEY}}
