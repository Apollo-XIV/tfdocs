name: Terraform Plan
on:
  workflow_call:
jobs:
  tf-plan:
    name: Terraform Plan
    permissions: write-all
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Terraform plan
        run: |
          unset AWS_PROFILE
          terraform init
          terraform plan -out=plan
        env:
          TF_VAR_ENV: dev
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: reproio/terraform-j2md@master
        with:
          version: v0.0.7

      - run: |
          terraform show -json plan \
          |  terraform-j2md \
          >> $GITHUB_STEP_SUMMARY
    
      - name: Scan Generated Plan File
        uses: ./.github/actions/checkov-scan
        with:
          plan: true

      - name: Upload plan as Artefact
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: infra/plan
