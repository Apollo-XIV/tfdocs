name: Dev PR Terraform Checks

concurrency:
  group: dev-pr-terraform-${{github.event.pull_request.number}}
  cancel-in-progress: true

# Triggers
on:
  pull_request:
    branches:
      - dev
    paths:
      - '**.tf'
      - 'envs/**'
      - 'infra/**'
      - 'tests/**'
  merge_group:

# All jobs must pass before merge
jobs:
  sync-environment:
    # only bother with syncing envs when the PR is opened, otherwise the user can do it
    if: github.event.action == 'opened'
    name: Sync Terraform Environment
    permissions: write-all
    uses: ./.github/workflows/sync-env.yaml
    secrets: inherit

  create-plan:
    if: always()
    name: Terraform Plan
    needs: sync-environment
    permissions: write-all
    secrets: inherit
    uses: ./.github/workflows/tf-plan.yaml

        
