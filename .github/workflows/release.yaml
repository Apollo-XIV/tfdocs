name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-appimage:
    name: Create AppImage Build
    runs-on: ubuntu-24.04
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - name: Run Build
        uses: ./.github/actions/build-appimage
      - uses: actions/upload-artifact@v4
        with:
          path: tfdocs.AppImage
          name: tfdocs-appimage

