name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-py:
    name: Build PyPI Artefacts
    runs-on: ubuntu-24.04
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-py
      - uses: actions/upload-artifact@v4
        with:
          path: dist/tfdocs-0.1.0-py3-none-any.whl
          name: tfdocs-whl
      - uses: actions/upload-artifact@v4
        with:
          path: dist/tfdocs-0.1.0.tar.gz
          name: tfdocs-src

  build-appimage:
    name: Create AppImage Build
    runs-on: ubuntu-24.04
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - name: Run Build
        uses: ./.github/actions/build-appimage
      - uses: actions/upload-artifact@v4
        with:
          path: tfdocs.AppImage
          name: tfdocs-appimage

  # build-macos:
  #   name: Build App for MacOS
  #   runs-on: macos-latest-large
  #   permissions: write-all
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Run Build for MacOS
  #       uses: ./.github/actions/build-macos
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         path: tfdocs.app
  #         name: tfdocs-macos

  # build-win:
  #   name: Build EXE for Windows
  #   runs-on: windows-latest
  #   permissions: write-all
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Run Build for Windows
  #       uses: ./.github/actions/build-win
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         path: tfdocs.exe
  #         name: tfdocs-win

  create-release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs:
      - build-appimage
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.BRANCH_BYPASS_KEY }}

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: tfdocs-appimage
          path: tfdocs.appimage

      - run: |
          ls
          stat tfdocs.appimage

      - name: Create Release
        env:
          tag: ${{github.ref_name}}
        run: |
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [[ $branch -eq "main" ]]; then
            inc="Minor"
          elif [[ $branch -eq "dev" ]]; then
            inc="Patch"
            prerelease="--preprelease"
          else
            inc="PR Build"            
            prerelease="--preprelease"
          fi
          
          date=$(date +'%Y-%m-%d')
          title="TFDocs $tag Release"
          release_notes="$inc release of TFDocs, published on $date."

          gh release create $tag \
            $prerelease \
            --title $title \
            --verify-tag \
            --notes $release_notes \
            tfdocs.appimage


