  #         path: tfdocs.exe
  #         name: tfdocs-win

  create-release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs:
      - build-appimage
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.BRANCH_BYPASS_KEY }}

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: tfdocs-appimage
          path: tfdocs.appimage

      - run: |
          ls
          stat tfdocs.appimage

      - name: Create Release
        env:
          tag: ${{github.ref_name}}
        run: |
          gh release create $tag tfdocs.appimage


