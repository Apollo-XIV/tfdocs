name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-appimage:
    name: Create AppImage Build
    runs-on: ubuntu-24.04
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - name: Run Build
        uses: ./.github/actions/build-appimage
      - uses: actions/upload-artifact@v4
        with:
          path: tfdocs.AppImage
          name: tfdocs-appimage

  # build-macos:
  #   name: Build App for MacOS
  #   runs-on: macos-latest-large
  #   permissions: write-all
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Run Build for MacOS
  #       uses: ./.github/actions/build-macos
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         path: tfdocs.app
  #         name: tfdocs-macos

  # build-win:
  #   name: Build EXE for Windows
  #   runs-on: windows-latest
  #   permissions: write-all
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Run Build for Windows
  #       uses: ./.github/actions/build-win
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         path: tfdocs.exe
  #         name: tfdocs-win

  create-release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs:
      - build-appimage
    permissions: write-all
    steps:
      - uses: actions/checkout@v4

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: tfdocs-appimage
          path: tfdocs.appimage

      - run: |
          ls
          stat tfdocs.appimage

      - name: Set current date
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            New release dated ${{env.CURRENT_DATE}}            
          fail_on_unmatched_files: true
          files: |
            tfdocs.appimage
          # tfdocs.app
          # tfdocs.exe
