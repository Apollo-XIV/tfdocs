  #         name: tfdocs-win

  create-release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs:
      - build-appimage
      - build-py
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.BRANCH_BYPASS_KEY }}

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      # DOWNLOAD BUILDS

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: tfdocs-appimage
          path: .

      - name: Download PyPI Artefacts
        uses: actions/download-artifact@v4
        with:
          name: tfdocs-whl
          path: .

      - name: Download PyPI Artefacts
        uses: actions/download-artifact@v4
        with:
          name: tfdocs-src
          path: .

      - run: |
          ls
          stat tfdocs.AppImage

      # Create the release and upload builds

      - name: Create Release
        env:
          tag: ${{github.ref_name}}
          GH_TOKEN: ${{github.token}}
        run: |
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [[ $branch -eq "main" ]]; then
            inc="Minor"
          elif [[ $branch -eq "dev" ]]; then
            inc="Patch"
            prerelease="--prerelease"
          else
            inc="PR Build"            
            prerelease="--prerelease"
          fi
          
          date=$(date +'%Y-%m-%d')
          title="TFDocs $tag"
          commit_msg=$(git show -s --format=%B "$tag")
          release_notes="$inc release of TFDocs, published on $date.\n $commit_msg"

          echo "Creating release $tag on branch $branch"

          # gh release create $tag
          gh release create "$tag" \
            $prerelease \
            --title "$title" \
            --notes "$release_notes" \
            tfdocs.AppImage \
            tfdocs-0.1.0-py3-none-any.whl \
            tfdocs-0.1.0.tar.gz


